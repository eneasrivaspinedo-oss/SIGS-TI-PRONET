openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API del sistema SIGS-TI PRONET
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Acceso y sesión
  - name: dashboard
    description: Resumen operativo
  - name: clients
    description: Clientes
  - name: projects
    description: Proyectos
  - name: incidents
    description: Mesa de ayuda e incidencias
  - name: users
    description: Usuarios del sistema
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Inicia sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Credenciales inválidas
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Cierra sesión
      responses:
        "204":
          description: Sesión cerrada
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Usuario autenticado
      responses:
        "200":
          description: Usuario actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: No autenticado
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Resumen del estado operativo
      responses:
        "200":
          description: Resumen del dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: Lista clientes
      parameters:
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Crea un cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Cliente creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /clients/{id}:
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Actualiza un cliente
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Cliente actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Elimina un cliente
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Cliente eliminado
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: Lista proyectos
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProjectStatus"
      responses:
        "200":
          description: Proyectos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Crea un proyecto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Proyecto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{id}:
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Actualiza un proyecto
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Proyecto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /incidents:
    get:
      operationId: listIncidents
      tags: [incidents]
      summary: Lista incidencias
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/IncidentStatus"
        - name: priority
          in: query
          schema:
            $ref: "#/components/schemas/IncidentPriority"
      responses:
        "200":
          description: Incidencias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"
    post:
      operationId: createIncident
      tags: [incidents]
      summary: Registra una incidencia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentInput"
      responses:
        "201":
          description: Incidencia creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
  /incidents/{id}:
    patch:
      operationId: updateIncident
      tags: [incidents]
      summary: Actualiza una incidencia
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentUpdate"
      responses:
        "200":
          description: Incidencia actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Lista usuarios
      responses:
        "200":
          description: Usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Search:
      name: search
      in: query
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    User:
      type: object
      required: [id, name, email, role, status]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [ADMINISTRADOR, SUPERVISOR, TECNICO, CLIENTE]
        status:
          type: string
          enum: [active]
        avatar: { type: ["string", "null"] }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    AuthSession:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    DashboardSummary:
      type: object
      required: [activeIncidents, criticalIncidents, activeProjects, clients, recentIncidents]
      properties:
        activeIncidents: { type: integer }
        criticalIncidents: { type: integer }
        activeProjects: { type: integer }
        clients: { type: integer }
        recentIncidents:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
        incidentByStatus:
          type: object
          additionalProperties: { type: integer }
    Client:
      type: object
      required: [id, name, industry, contactName, contactEmail, status, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        industry: { type: string }
        contactName: { type: string }
        contactEmail: { type: string, format: email }
        phone: { type: ["string", "null"] }
        status:
          type: string
          enum: [active, paused]
        createdAt: { type: string, format: date-time }
    ClientInput:
      type: object
      required: [name, industry, contactName, contactEmail]
      properties:
        name: { type: string, minLength: 1 }
        industry: { type: string, minLength: 1 }
        contactName: { type: string, minLength: 1 }
        contactEmail: { type: string, format: email }
        phone: { type: string }
    ClientUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        industry: { type: string, minLength: 1 }
        contactName: { type: string, minLength: 1 }
        contactEmail: { type: string, format: email }
        phone: { type: string }
        status:
          type: string
          enum: [active, paused]
    Project:
      type: object
      required: [id, name, clientId, clientName, status, progress, startDate, dueDate]
      properties:
        id: { type: integer }
        name: { type: string }
        clientId: { type: integer }
        clientName: { type: string }
        status:
          $ref: "#/components/schemas/ProjectStatus"
        progress: { type: integer, minimum: 0, maximum: 100 }
        startDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        leadName: { type: ["string", "null"] }
    ProjectStatus:
      type: string
      enum: [active, planning, completed, paused]
    ProjectInput:
      type: object
      required: [name, clientId, status, progress, startDate, dueDate]
      properties:
        name: { type: string, minLength: 1 }
        clientId: { type: integer, minimum: 1 }
        status:
          $ref: "#/components/schemas/ProjectStatus"
        progress: { type: integer, minimum: 0, maximum: 100 }
        startDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        leadName: { type: string }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        status:
          $ref: "#/components/schemas/ProjectStatus"
        progress: { type: integer, minimum: 0, maximum: 100 }
        dueDate: { type: string, format: date }
        leadName: { type: string }
    Incident:
      type: object
      required: [id, code, title, description, clientId, clientName, priority, status, category, createdAt, updatedAt]
      properties:
        id: { type: integer }
        code: { type: string }
        title: { type: string }
        description: { type: string }
        clientId: { type: integer }
        clientName: { type: string }
        priority:
          $ref: "#/components/schemas/IncidentPriority"
        status:
          $ref: "#/components/schemas/IncidentStatus"
        category: { type: string }
        assigneeName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IncidentPriority:
      type: string
      enum: [critical, high, medium, low]
    IncidentStatus:
      type: string
      enum: [open, in_progress, pending, resolved, closed]
    IncidentInput:
      type: object
      required: [title, description, clientId, priority, category]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        clientId: { type: integer, minimum: 1 }
        priority:
          $ref: "#/components/schemas/IncidentPriority"
        category: { type: string, minLength: 1 }
        assigneeId: { type: ["integer", "null"] }
    IncidentUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        priority:
          $ref: "#/components/schemas/IncidentPriority"
        status:
          $ref: "#/components/schemas/IncidentStatus"
        category: { type: string, minLength: 1 }
        assigneeId: { type: ["integer", "null"] }

